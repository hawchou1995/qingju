name: 青橘 Release 构建与发布

# 触发面刻意收窄：
# - 只有 `qingju-v*` 标签或手动 workflow_dispatch 会进入本流水线，任何分支 push
#   都不会触发（上游 build.yaml 只响应 `v*`，青橘标签不会误触发上游发版）。
# - 标签 push 只构建：五端产物上传为 artifact，不创建 Release、不打标签。
# - 只有手动运行并显式选择 `publish` 才会运行 publish job；正式发布（0.2.34 起）
#   由验证过 build-only 产物的 `gh release create` 单独完成，复用这些 artifact。
# - 版本号没有默认值：未填写时取 `pubspec.yaml` 的版本，且必须与 pubspec 完全一致。
on:
  push:
    tags:
      - 'qingju-v*'
  workflow_dispatch:
    inputs:
      mode:
        description: 'build-only 只构建五端产物；publish 构建后创建 GitHub Release'
        type: choice
        options:
          - build-only
          - publish
        default: build-only
      version:
        description: '目标版本（qingju-vX.Y.Z 或 X.Y.Z）；留空则用 pubspec.yaml 的版本'
        required: false
        default: ''
      prerelease:
        description: '发布为预发布（仅 publish 模式生效）'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: qingju-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: 校验版本
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: 解析并校验版本
        id: resolve
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          pubspec_version="$(sed -n 's/^version:[[:space:]]*\([0-9][0-9.]*\)+.*/\1/p' pubspec.yaml | head -n1)"
          if [ -z "${pubspec_version}" ]; then
            echo '::error::无法从 pubspec.yaml 读取版本'
            exit 1
          fi
          if [ "${REF_TYPE}" = "tag" ]; then
            version="${REF_NAME#qingju-v}"
          elif [ -n "${REQUESTED_VERSION}" ]; then
            version="${REQUESTED_VERSION#qingju-v}"
          else
            version="${pubspec_version}"
          fi
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::版本格式无效（需要 X.Y.Z）：${version}"
            exit 1
          fi
          if [ "${version}" != "${pubspec_version}" ]; then
            echo "::error::版本与 pubspec.yaml 不一致：请求 ${version}，pubspec ${pubspec_version}"
            exit 1
          fi
          echo "tag=qingju-v${version}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
  # 发版前置门禁：验证 i18n 生成结果，跑站点边界、插件注册、资料统计配置、
  # 登录回归与架构守卫；任一步失败则五端构建与发布都不执行（失败不会降级为跳过）。
  preflight:
    name: 前置检查（i18n + 站点边界 + 登录回归 + 架构守卫）
    needs: [version]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          cache: true
      - name: 安装 Linux 桌面前置依赖（GTK/X11/XI 头文件 + pkg-config）
        run: |
          # cnativeapi 0.6.1 的 pkg-config 依赖 gtk+-3.0 / x11 / xi；native hook 编译需要 ninja 与 clang。
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libx11-dev libxi-dev pkg-config ninja-build clang
          pkg-config --exists gtk+-3.0 x11 xi
      - name: 生成 i18n 与依赖
        run: dart tool/project_prep.dart test
      - name: 校验 i18n 生成结果
        run: dart tool/gen_l10n.dart --check
      - name: 补齐测试资源目录
        run: |
          # 单测不创建生产 CA；仅补齐 pubspec 声明的空资源目录（与 network-regression 一致）。
          mkdir -p assets/certs
      - name: 站点边界、插件注册与统计配置回归
        run: |
          flutter test --no-pub \
            test/services/qingju_site_boundary_test.dart \
            test/models/profile_stats_config_test.dart \
            test/plugins/plugin_registry_test.dart
      - name: 登录回归测试
        run: |
          flutter test --no-pub \
            test/pages/webview_login_branding_test.dart \
            test/pages/login_cta_navigation_test.dart \
            test/widgets/login_localization_test.dart
      - name: 架构守卫测试
        run: flutter test --no-pub test/architecture

  build:
    name: 构建 ${{ matrix.platform }}
    needs: [version, preflight]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-24.04
          - platform: ios
            os: macos-15
          - platform: macos
            os: macos-15
          - platform: windows
            os: windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      QINGJU_RELEASE_TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/net_core
          key: qingju-release-${{ matrix.platform }}
      - name: Android Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore stable Android debug keystore
        if: matrix.platform == 'android'
        env:
          QINGJU_DEBUG_KEYSTORE_BASE64: ${{ secrets.QINGJU_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$QINGJU_DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::QINGJU_DEBUG_KEYSTORE_BASE64 secret is required"
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$QINGJU_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -storetype JKS -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null 2>&1
          {
            printf 'storeFile=%s\n' "$HOME/.android/debug.keystore"
            printf 'keyAlias=androiddebugkey\n'
            printf 'storePassword=android\n'
            printf 'keyPassword=android\n'
          } > android/key.properties
          chmod 600 android/key.properties
      - name: Android Rust
        if: matrix.platform == 'android'
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked
      - name: Windows NASM
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          'C:\Program Files\NASM' >> $env:GITHUB_PATH
      - name: Apple Rust
        if: matrix.platform == 'ios' || matrix.platform == 'macos'
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios aarch64-apple-darwin x86_64-apple-darwin
      - name: Prepare
        run: dart tool/project_prep.dart app
      - name: Build Android ARM64 debug signed
        if: matrix.platform == 'android'
        run: dart tool/flutterw.dart build apk --debug --target-platform android-arm64
      - name: Build iOS unsigned
        if: matrix.platform == 'ios'
        run: dart tool/flutterw.dart build ios --release --no-codesign
      - name: Build macOS ARM64 adhoc
        if: matrix.platform == 'macos'
        env:
          FLUXDO_MACOS_ARCH: arm64
          FLUTTER_XCODE_EXCLUDED_ARCHS: x86_64
        run: dart tool/flutterw.dart build macos --release
      - name: Build Windows x64
        if: matrix.platform == 'windows'
        run: dart tool/flutterw.dart build windows --release
      - name: Package Android
        if: matrix.platform == 'android'
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk dist/qingju-android-arm64-debug.apk
      - name: Package iOS
        if: matrix.platform == 'ios'
        run: |
          mkdir -p dist/Payload
          cp -R build/ios/iphoneos/Runner.app dist/Payload/
          cd dist
          zip -qr qingju-ios-arm64-unsigned.ipa Payload
          rm -rf Payload
      - name: Package macOS
        if: matrix.platform == 'macos'
        run: |
          mkdir -p dist
          app=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)
          test -n "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" dist/qingju-macos-arm64-adhoc.zip
      - name: Package Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist -Force
          if (!(Test-Path build/windows/x64/runner/Release/qingju.exe)) { throw '应用未生成' }
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/qingju-windows-x64.zip
      - name: Hash and provenance
        shell: pwsh
        run: |
          $version = $env:QINGJU_RELEASE_TAG -replace '^qingju-v', ''
          if ($version -notmatch '^\d+(\.\d+){2,3}$') { throw '发布标签版本格式无效' }
          Get-ChildItem dist -File | ForEach-Object {
            Rename-Item $_.FullName ($_.Name -replace '^qingju-', "qingju-$version-")
          }
          $files = Get-ChildItem dist -File
          if (!$files) { throw '没有产物' }
          $files | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content "dist/SHA256SUMS-${{ matrix.platform }}.txt"
          "commit=$env:GITHUB_SHA`nplatform=${{ matrix.platform }}`nrun=$env:GITHUB_RUN_ID" | Set-Content "dist/BUILD-${{ matrix.platform }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  linux:
    name: 构建 linux
    needs: [version, preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      QINGJU_RELEASE_TAG: ${{ needs.version.outputs.tag }}
      # 便于诊断编译失败：需要时置为 --verbose。
      FLUXDO_LINUX_BUILD_FLAGS: ${{ vars.FLUXDO_LINUX_BUILD_FLAGS }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build Linux in Arch with WPE
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/project" -w /project \
            -e FLUTTER_VERSION=3.50.0 -e FLUXDO_LINUX_BUILD_FLAGS="$FLUXDO_LINUX_BUILD_FLAGS" \
            archlinux:base-20260906.0.587075 bash scripts/ci/linux/qingju_container.sh
          sudo chown -R "$(id -u):$(id -g)" .artifacts build
          mkdir -p dist
          version="${QINGJU_RELEASE_TAG#qingju-v}"
          [[ "$version" =~ ^[0-9]+(\.[0-9]+){2,3}$ ]] || { echo '发布标签版本格式无效'; exit 1; }
          cp .artifacts/linux/fluxdo-linux-bundle.tar.gz "dist/qingju-$version-linux-x64.tar.gz"
          sha256sum "dist/qingju-$version-linux-x64.tar.gz" > "dist/SHA256SUMS-linux.txt"
          printf 'commit=%s\nplatform=linux-x64\n' "$GITHUB_SHA" > "dist/BUILD-linux.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # 唯一的发布入口：只有手动 workflow_dispatch 且显式选择 publish 才会发布；
  # 标签 push 一律只构建（正式发版走 `gh release create` 复用 build-only 产物）。
  publish:
    name: 发布 Release
    needs: [version, preflight, build, linux]
    # 发布许可：只有手动运行且显式选择 publish 模式；标签 push 不再构成发布许可。
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      QINGJU_RELEASE_TAG: ${{ needs.version.outputs.tag }}
      QINGJU_RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true
      - name: List assets
        run: |
          ls -l dist
          cat dist/BUILD-*.txt
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.QINGJU_RELEASE_TAG }}
          name: 青橘 ${{ env.QINGJU_RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          body: |
            青橘社区（qingju.me）第三方客户端，基于 FluxDO（GPL-3.0）二开。

            - Android：ARM64 debug 测试签名 APK，可侧载。
            - iOS：无签名 IPA，需自备证书重签。
            - macOS：ARM64 adhoc 签名，未公证。
            - Windows：x64 解压即用。
            - Linux：x64 压缩包，需兼容的 glibc/GTK3/WPE 环境。

            应用内部版本为 ${{ needs.version.outputs.version }}（与 `pubspec.yaml` 一致）；各安装包文件名带版本号，并附 `BUILD-<platform>.txt` 与 `SHA256SUMS-<platform>.txt`。
            Android 使用固定测试证书签名；若与此前安装包的签名证书不一致，需先卸载旧包再安装。
          files: dist/*
