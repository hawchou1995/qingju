name: 青橘 Release 构建与发布

# 只用 qingju-v* 标签，避免触发上游 build.yaml 的 v* 发版流水线。
on:
  push:
    tags:
      - 'qingju-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 发布标签（qingju-v 前缀）
        required: true
        default: qingju-v0.2.33
      prerelease:
        description: 是否发布为预发布（true/false）
        required: true
        default: 'false'

permissions:
  contents: write

concurrency:
  group: qingju-release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUXDO_LINUX_BUILD_FLAGS: ''
  QINGJU_RELEASE_TAG: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-24.04
          - platform: ios
            os: macos-15
          - platform: macos
            os: macos-15
          - platform: windows
            os: windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/doh_proxy
          key: qingju-release-${{ matrix.platform }}
      - name: Android Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore stable Android debug keystore
        if: matrix.platform == 'android'
        env:
          QINGJU_DEBUG_KEYSTORE_BASE64: ${{ secrets.QINGJU_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$QINGJU_DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::QINGJU_DEBUG_KEYSTORE_BASE64 secret is required"
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$QINGJU_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -storetype JKS -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null 2>&1
          {
            printf 'storeFile=%s\n' "$HOME/.android/debug.keystore"
            printf 'keyAlias=androiddebugkey\n'
            printf 'storePassword=android\n'
            printf 'keyPassword=android\n'
          } > android/key.properties
          chmod 600 android/key.properties
      - name: Android Rust
        if: matrix.platform == 'android'
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked
      - name: Windows NASM
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          'C:\Program Files\NASM' >> $env:GITHUB_PATH
      - name: Apple Rust
        if: matrix.platform == 'ios' || matrix.platform == 'macos'
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios aarch64-apple-darwin x86_64-apple-darwin
      - name: Prepare
        run: dart tool/project_prep.dart app
      - name: Build Android ARM64 debug signed
        if: matrix.platform == 'android'
        run: dart tool/flutterw.dart build apk --debug --target-platform android-arm64
      - name: Build iOS unsigned
        if: matrix.platform == 'ios'
        run: dart tool/flutterw.dart build ios --release --no-codesign
      - name: Build macOS ARM64 adhoc
        if: matrix.platform == 'macos'
        env:
          FLUXDO_MACOS_ARCH: arm64
          FLUTTER_XCODE_EXCLUDED_ARCHS: x86_64
        run: dart tool/flutterw.dart build macos --release
      - name: Build Windows x64
        if: matrix.platform == 'windows'
        run: dart tool/flutterw.dart build windows --release
      - name: Package Android
        if: matrix.platform == 'android'
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk dist/qingju-android-arm64-debug.apk
      - name: Package iOS
        if: matrix.platform == 'ios'
        run: |
          mkdir -p dist/Payload
          cp -R build/ios/iphoneos/Runner.app dist/Payload/
          cd dist
          zip -qr qingju-ios-arm64-unsigned.ipa Payload
          rm -rf Payload
      - name: Package macOS
        if: matrix.platform == 'macos'
        run: |
          mkdir -p dist
          app=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)
          test -n "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" dist/qingju-macos-arm64-adhoc.zip
      - name: Package Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist -Force
          if (!(Test-Path build/windows/x64/runner/Release/qingju.exe)) { throw '应用未生成' }
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/qingju-windows-x64.zip
      - name: Hash and provenance
        shell: pwsh
        run: |
          $version = $env:QINGJU_RELEASE_TAG -replace '^qingju-v', ''
          if ($version -notmatch '^\d+(\.\d+){2,3}$') { throw '发布标签版本格式无效' }
          Get-ChildItem dist -File | ForEach-Object {
            Rename-Item $_.FullName ($_.Name -replace '^qingju-', "qingju-$version-")
          }
          $files = Get-ChildItem dist -File
          if (!$files) { throw '没有产物' }
          $files | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content "dist/SHA256SUMS-${{ matrix.platform }}.txt"
          "commit=$env:GITHUB_SHA`nplatform=${{ matrix.platform }}`nrun=$env:GITHUB_RUN_ID" | Set-Content "dist/BUILD-${{ matrix.platform }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build Linux in Arch with WPE
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/project" -w /project \
            -e FLUTTER_VERSION=3.44.8 -e FLUXDO_LINUX_BUILD_FLAGS="$FLUXDO_LINUX_BUILD_FLAGS" \
            archlinux:base-20260906.0.587075 bash scripts/ci/linux/qingju_container.sh
          sudo chown -R "$(id -u):$(id -g)" .artifacts build
          mkdir -p dist
          version="${QINGJU_RELEASE_TAG#qingju-v}"
          [[ "$version" =~ ^[0-9]+(\.[0-9]+){2,3}$ ]] || { echo '发布标签版本格式无效'; exit 1; }
          cp .artifacts/linux/fluxdo-linux-bundle.tar.gz "dist/qingju-$version-linux-x64.tar.gz"
          sha256sum "dist/qingju-$version-linux-x64.tar.gz" > "dist/SHA256SUMS-linux.txt"
          printf 'commit=%s\nplatform=linux-x64\n' "$GITHUB_SHA" > "dist/BUILD-linux.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [build, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true
      - name: List assets
        run: |
          ls -l dist
          cat dist/BUILD-*.txt
      - name: Resolve tag
        id: tag
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: 青橘 ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          generate_release_notes: true
          body: |
            青橘社区（qingju.me）第三方客户端，基于 FluxDO（GPL-3.0）二开。

            - Android：ARM64 debug 测试签名 APK，可侧载。
            - iOS：无签名 IPA，需自备证书重签。
            - macOS：ARM64 adhoc 签名，未公证。
            - Windows：x64 解压即用。
            - Linux：x64 压缩包，需兼容的 glibc/GTK3/WPE 环境。

            本版修复 `PreloadedDataService` 首页话题列表并发解析时重复完成 Future 的异步竞态；同时保留 0.2.32 的固定 Android debug signer、GitHub OAuth 登录归位、登录标题与 Release tag / ARM64 APK 更新解析修复。
            应用内部版本为 0.2.33；各安装包文件名带版本号，并附 `BUILD-<platform>.txt` 与 `SHA256SUMS-<platform>.txt`。
            Android 固定测试证书与 0.2.30/0.2.31 不同，首次升级需先卸载旧包；0.2.32 及之后同证书构建可覆盖安装。真实 GitHub OAuth 账号登录仍需实机验收。
          files: dist/*
